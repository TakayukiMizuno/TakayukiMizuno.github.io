<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>科学教室 | バイオメカトロニクス研究室</title>
<style>
:root{--bg:#f7f8f6;--paper:#fff;--ink:#222;--muted:#66706a;--line:#d8ddd9;--green:#315a45;--soft:#eef3ef;--yellow:#fff4bf}
*{box-sizing:border-box}
body{margin:0;font-family:"Yu Gothic",Meiryo,sans-serif;line-height:1.8;color:var(--ink);background:var(--bg)}
a{color:inherit}
.wrap{max-width:1040px;margin:auto;padding:0 24px}
header{background:linear-gradient(135deg,#eef3ef,#fff7cf);border-bottom:1px solid var(--line);padding:44px 0}
.bread{font-size:.86rem;color:var(--muted);margin-bottom:12px}
h1{font-size:clamp(2rem,5vw,3.6rem);line-height:1.2;margin:.2em 0}
.lead{font-size:1.15rem;font-weight:700;max-width:760px}
section{padding:42px 0}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:26px;text-decoration:none}
.card.active{border-color:#9bb3a2}
.card small{display:block;color:var(--green);font-weight:700;letter-spacing:.04em}
.card h2{margin:.35em 0 .4em;font-size:1.45rem}
.card p{margin:0;color:var(--muted)}
.tag{display:inline-block;margin-top:16px;padding:5px 10px;border-radius:999px;background:var(--soft);color:var(--green);font-size:.82rem;font-weight:700}
.note{background:#24372d;color:#fff;border-radius:18px;padding:26px}
.note h2{margin-top:0}
footer{border-top:1px solid var(--line);padding:28px 0 48px;color:var(--muted);font-size:.9rem}
footer a{color:var(--green)}
@media(max-width:720px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap">
<div class="bread"><a href="/university/">バイオメカトロニクス研究室</a> ＞ 科学教室</div>
<h1>科学教室</h1>
<p class="lead">見て、くらべて、考えてみよう。<br>「どうして？」から始まる、小さな科学の入口です。</p>
</div></header>

<main>
<section><div class="wrap">
<div class="cards">
<a class="card active" href="/university/science/robot/">
<small>ROBOT / ロボット</small>
<h2>ロボットを考えてみよう</h2>
<p>ロボットって何だろう？ 足は必要？ 形や材質が変わると、動きはどう変わる？</p>
<span class="tag">見てみる →</span>
</a>
<div class="card" aria-disabled="true">
<small>MORE / これから</small>
<h2>ほかの科学教室も追加予定です</h2>
<p>実験やイベントに合わせて、少しずつテーマを増やしていきます。</p>
<span class="tag">準備中</span>
</div>
</div>
</div></section>

<section><div class="wrap">
<div class="note">
<h2>答えを覚えるだけじゃない</h2>
<p>まず予想して、見て、くらべてみます。予想とちがっても大丈夫。そこから「なぜ？」が始まります。</p>
</div>
</div></section>
</main>

<footer><div class="wrap">
<a href="/university/">← バイオメカトロニクス研究室へ</a>
</div></footer>
</body>
</html>
