<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ロボットを考えてみよう | 科学教室</title>
<style>
:root{--bg:#f7f8f6;--paper:#fff;--ink:#222;--muted:#66706a;--line:#d8ddd9;--green:#315a45;--soft:#eef3ef;--blue:#edf5f7;--yellow:#fff5c9}
*{box-sizing:border-box}
body{margin:0;font-family:"Yu Gothic",Meiryo,sans-serif;line-height:1.8;color:var(--ink);background:var(--bg)}
a{color:inherit}
.wrap{max-width:1040px;margin:auto;padding:0 24px}
header{background:linear-gradient(135deg,#edf5f7,#fff5c9);border-bottom:1px solid var(--line);padding:44px 0}
.bread{font-size:.86rem;color:var(--muted);margin-bottom:12px}
h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.2;margin:.2em 0}
.lead{font-size:1.15rem;font-weight:700}
section{padding:42px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:26px;text-decoration:none}
.card h2{margin:.2em 0 .45em;font-size:1.45rem}
.card p{margin:0;color:var(--muted)}
.num{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--green);font-weight:800}
.go{display:inline-block;margin-top:16px;color:var(--green);font-weight:700}
.ready{display:inline-block;margin-top:16px;color:var(--muted);font-weight:700}
.callout{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px}
.callout strong{color:var(--green)}
footer{border-top:1px solid var(--line);padding:28px 0 48px;color:var(--muted);font-size:.9rem}
footer a{color:var(--green)}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap">
<div class="bread"><a href="/university/science/">科学教室</a> ＞ ロボット</div>
<h1>ロボットを考えてみよう</h1>
<p class="lead">足がある？ 車輪がある？ どっちもない？<br>まずは、いつもの「ロボット」のイメージを少し広げてみよう。</p>
</div></header>

<main>
<section><div class="wrap">
<div class="grid">
<div class="card" aria-disabled="true">
<span class="num">1</span>
<h2>ロボットって何？</h2>
<p>人の形？ 工場の機械？ 自動で動くもの？ 「ロボットらしさ」って何だろう。</p>
<span class="ready">準備中</span>
</div>

<a class="card" href="/university/science/robot/need-legs/">
<span class="num">2</span>
<h2>ロボットに足は必要？</h2>
<p>2本、4本、6本。どれがよい？ でも、そもそも足がなくても進めるかもしれません。</p>
<span class="go">考えてみる →</span>
</a>
</div>
</div></section>

<section><div class="wrap">
<div class="callout">
<strong>ひとつの答えを急がなくて大丈夫。</strong>
<p>どこを動くロボット？ 何をしたいロボット？ 条件が変わると、よい形も変わるかもしれません。</p>
</div>
</div></section>
</main>

<footer><div class="wrap">
<a href="/university/science/">← 科学教室へ</a>　｜　
<a href="/university/">バイオメカトロニクス研究室へ</a>
</div></footer>
</body>
</html>
